<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Sreyas QPGEN</title>

    <style>
        :root {
            --ink: #1a2530;
            --accent: #3498db;
            --accent-deep: #2980b9;
            --glass: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.18);
            --error: #e74c3c;
            --text-soft: rgba(255, 255, 255, 0.72);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
        }

        .auth-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            /* Drop your campus photo at static/images/ss.jpg — falls
               back to a plausible sky/campus-toned gradient until you do,
               so the page still looks intentional with nothing missing. */
            background-image:
                linear-gradient(160deg, #4a6b7a 0%, #2e4a3e 55%, #1a2e22 100%);
            background-size: cover;
            background-position: center;
            animation: bg-breathe 24s ease-in-out infinite alternate;
        }
        .auth-bg.has-photo {
            background-image: url("{{ url_for('static', filename='images/scaled.jpg') }}");
        }
        @keyframes bg-breathe {
            from { transform: scale(1); }
            to   { transform: scale(1.06); }
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgba(10, 18, 14, 0.35) 0%, rgba(10, 18, 14, 0.65) 100%);
        }

        .auth-wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            padding: 40px 36px 36px;
            border-radius: 22px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
            text-align: center;
            color: #fff;
            opacity: 0;
            transform: translateY(14px);
            animation: card-rise 0.5s ease-out 0.1s forwards;
        }
        @keyframes card-rise {
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo-circle {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .auth-logo-circle img {
            width: 78%;
            height: 78%;
            object-fit: contain;
        }

        .auth-title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }
        .auth-subtitle {
            margin: 4px 0 26px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            color: var(--text-soft);
        }

        .auth-error {
            background: rgba(231, 76, 60, 0.18);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #ffd9d4;
            font-size: 0.85rem;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            padding: 4px 16px;
            margin-bottom: 14px;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }
        .input-pill:focus-within {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.25);
        }
        .input-icon {
            font-size: 1rem;
            opacity: 0.85;
            line-height: 1;
        }
        .input-pill input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
            font-size: 0.95rem;
            padding: 12px 0;
        }
        .input-pill input::placeholder { color: rgba(255,255,255,0.55); }
        .toggle-eye {
            cursor: pointer;
            opacity: 0.6;
            font-size: 1rem;
            transition: opacity 0.15s;
            user-select: none;
        }
        .toggle-eye:hover { opacity: 1; }

        .auth-btn {
            width: 100%;
            padding: 13px 0;
            margin-top: 8px;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.18s, transform 0.1s;
        }
        .auth-btn:hover { background: var(--accent-deep); }
        .auth-btn:active { transform: scale(0.98); }

        .auth-switch {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-soft);
        }
        .auth-switch a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.4);
        }
        .auth-switch a:hover { border-color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            .auth-bg { animation: none; }
            .auth-card { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>

<div class="auth-bg has-photo"></div>
<div class="auth-overlay"></div>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo-circle">
            <img src="{{ url_for('static', filename='images/sreyas.png') }}" alt="Sreyas Institute logo">
        </div>

        <h1 class="auth-title">WELCOME BACK</h1>
        <p class="auth-subtitle">SREYAS QPGEN</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="auth-error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="input-pill">
                <span class="input-icon">👤</span>
                <input
                    type="text"
                    id="username"
                    name="username"
                    maxlength="50"
                    placeholder="Username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="input-pill">
                <span class="input-icon">🔒</span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
                <span class="toggle-eye" id="toggle-eye" role="button" aria-label="Show password">👁</span>
            </div>

            <button type="submit" class="auth-btn">Log In</button>
        </form>

        <p class="auth-switch">
            New here? <a href="{{ url_for('signup') }}">Create an account</a>
        </p>
    </div>
</div>

<script>
    const pwdInput = document.getElementById('password');
    const toggleEye = document.getElementById('toggle-eye');
    toggleEye.addEventListener('click', function () {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type = isHidden ? 'text' : 'password';
        toggleEye.style.opacity = isHidden ? '1' : '0.6';
        toggleEye.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
</script>

</body>
</html>
